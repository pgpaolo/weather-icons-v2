name: Icon request
description: Propose a new weather condition or a clearer variant
title: "[ICON] "
labels: ["icon-request"]
body:
  - type: input
    id: filename
    attributes:
      label: Proposed filename
      placeholder: example-condition.png
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Weather semantics
      description: Describe exactly what the icon should communicate.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility / mapping context
      description: Mention any provider code, day/night pair, or existing filename it must match.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that an equivalent icon does not already exist.
          required: true
