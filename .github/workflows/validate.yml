name: Validate icon set

on:
  push:
    branches:
      - main
    paths:
      - "icons/**"
      - "mappings/**"
      - "manifest.json"
      - "docs/ICON_CATALOG.md"
      - "docs/GALLERY.md"
      - "tools/build_metadata.py"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "icons/**"
      - "mappings/**"
      - "manifest.json"
      - "docs/ICON_CATALOG.md"
      - "docs/GALLERY.md"
      - "tools/build_metadata.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify metadata and mappings
        shell: bash
        run: |
          count=$(find icons -maxdepth 1 -type f -iname '*.png' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No published PNG icons on this branch; validation skipped."
            exit 0
          fi
          python tools/build_metadata.py --check
