name: Validate icon set

on:
  push:
    paths:
      - "icons/**"
      - "mappings/**"
      - "manifest.json"
      - "docs/ICON_CATALOG.md"
      - "docs/GALLERY.md"
      - "tools/build_metadata.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "icons/**"
      - "mappings/**"
      - "manifest.json"
      - "docs/ICON_CATALOG.md"
      - "docs/GALLERY.md"
      - "tools/build_metadata.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify metadata and mappings
        shell: bash
        run: |
          if [ ! -d icons ]; then
            echo "icons/ not published yet; validation will activate after the first source bundle sync."
            exit 0
          fi
          python tools/build_metadata.py --check
