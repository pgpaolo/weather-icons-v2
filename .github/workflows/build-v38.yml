name: Generate Weather Icons v3.8

on:
  push:
    branches:
      - v3.8
    paths:
      - 'tools/generate_v38.py'
      - '.github/workflows/build-v38.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3.8
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Resize and balance 147 visible artwork subjects
        run: python tools/generate_v38.py

      - name: Rebuild catalog, manifest and visual gallery
        run: python tools/build_metadata.py

      - name: Validate metadata and Aeris mapping
        run: python tools/build_metadata.py --check

      - name: Publish v3.8 icons and measurement audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/ manifest.json docs/ICON_CATALOG.md docs/GALLERY.md docs/V3_8_SIZE_AUDIT.md dist/source-icons.zip
          if git diff --cached --quiet; then
            echo "v3.8 asset set already current"
            exit 0
          fi
          git commit -m "feat(v3.8): publish normalized visible artwork at 120x120"
          git push origin HEAD:v3.8
