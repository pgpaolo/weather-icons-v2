name: Sync source bundle

on:
  push:
    branches:
      - main
      - feature/weather-icons-v3-redesign
    paths:
      - "dist/source-icons.zip"
      - "dist/icons-v3.5.zip"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select and validate source ZIP
        shell: bash
        run: |
          if [ -s dist/icons-v3.5.zip ]; then
            echo "ICON_SOURCE=dist/icons-v3.5.zip" >> "$GITHUB_ENV"
            unzip -t dist/icons-v3.5.zip >/dev/null
          else
            echo "ICON_SOURCE=dist/source-icons.zip" >> "$GITHUB_ENV"
            test -s dist/source-icons.zip
            unzip -t dist/source-icons.zip >/dev/null
          fi

      - name: Synchronize assets and metadata
        run: |
          python tools/sync_bundle.py "$ICON_SOURCE"
          python tools/build_metadata.py

      - name: Commit synchronized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons mappings manifest.json docs/ICON_CATALOG.md docs/GALLERY.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: sync v3.5 candidate icons and metadata"
          git push origin HEAD
