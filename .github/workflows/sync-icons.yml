name: Sync source bundle

on:
  push:
    branches: ["main"]
    paths:
      - "dist/source-icons.zip"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical ZIP
        shell: bash
        run: |
          test -s dist/source-icons.zip
          unzip -t dist/source-icons.zip >/dev/null

      - name: Synchronize assets and metadata
        run: |
          python tools/sync_bundle.py dist/source-icons.zip
          python tools/build_metadata.py

      - name: Commit synchronized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons mappings manifest.json docs/ICON_CATALOG.md docs/GALLERY.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: sync icons from canonical source bundle"
          git push
