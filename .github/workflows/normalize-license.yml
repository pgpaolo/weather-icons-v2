name: Validate proprietary license

on:
  push:
    branches: ["main"]
    paths:
      - "LICENSE"
      - ".github/workflows/normalize-license.yml"

permissions:
  contents: read

jobs:
  validate-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Personal Use License markers
        shell: bash
        run: |
          test -s LICENSE
          grep -q "Weather Icons Personal Use License" LICENSE
          grep -q "Gianpaolo P. (pgpaolo)" LICENSE
          grep -q "COMMERCIAL, PROFESSIONAL AND INSTITUTIONAL USE" LICENSE
