name: Normalize CC license

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/normalize-license.yml"

permissions:
  contents: write

jobs:
  normalize-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical CC BY-SA 4.0 legal text
        shell: bash
        run: |
          curl -fsSL https://creativecommons.org/licenses/by-sa/4.0/legalcode.txt -o LICENSE
          test -s LICENSE
          grep -q "Attribution-ShareAlike 4.0 International" LICENSE

      - name: Commit canonical license text
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          if git diff --cached --quiet; then
            echo "LICENSE already canonical."
            exit 0
          fi
          git commit -m "legal: use canonical CC BY-SA 4.0 license text"
          git push
